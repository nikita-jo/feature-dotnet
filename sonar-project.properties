# ============================================================================
# SonarQube project configuration
# ============================================================================

sonar.projectKey=EmployeeManagementPortal
sonar.projectName=EmployeeManagementPortal
sonar.projectVersion=1.0.0
sonar.organization=enterprise-corp

# Source and test paths
sonar.sources=src
sonar.tests=tests
sonar.exclusions=\
  **/bin/**, \
  **/obj/**, \
  **/wwwroot/**, \
  **/*.cshtml, \
  **/Migrations/**, \
  **/TestResults/**, \
  **/coverage*/**

sonar.test.exclusions=\
  **/bin/**, \
  **/obj/**

# Language
sonar.language=cs

# Coverage paths
sonar.cs.opencover.reportsPaths=coverage.opencover.xml
sonar.cs.cobertura.reportsPaths=coverage.cobertura.xml
sonar.coverage.exclusions=\
  **/Tests/**, \
  **/wwwroot/**, \
  **/*.cshtml, \
  **/Migrations/**

# Quality Gate (asserted in CI)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Branch / PR support
sonar.branch.name=${GITHUB_REF_NAME}
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=${GITHUB_REPOSITORY}
sonar.pullrequest.key=${PR_NUMBER}
sonar.pullrequest.branch=${GITHUB_HEAD_REF}
sonar.pullrequest.base=${GITHUB_BASE_REF}

# Source encoding
sonar.sourceEncoding=UTF-8

# Duplications
sonar.cpd.exclusions=**/Tests/**

# Analysis scope
sonar.scanner.scanAll=false
sonar.scm.provider=git
sonar.scm.disabled=false
