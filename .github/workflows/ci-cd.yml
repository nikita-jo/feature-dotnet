name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: EmployeeManagementPortal.sln
  TEST_PROJECT: tests/EmployeeManagementPortal.Tests/EmployeeManagementPortal.Tests.csproj
  COVERAGE_THRESHOLD: 85

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  actions: read

jobs:
  # Build Stage
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution (Debug)
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Debug

      - name: Build summary
        id: publish
        run: |
          echo "version=$(date +%Y.%m.%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "## Build Summary" > build-summary.md
          echo "- **Status**: ✅ Success" >> build-summary.md
          echo "- **Branch**: ${{ github.ref_name }}" >> build-summary.md
          echo "- **Commit**: ${{ github.sha }}" >> build-summary.md
          echo "- **Version**: ${{ steps.publish.outputs.version }}" >> build-summary.md
          echo "- **Triggered by**: ${{ github.actor }}" >> build-summary.md

      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-summary
          path: build-summary.md
          if-no-files-found: warn

  # Test & Coverage Stage
  test:
    name: 2. Test + Coverage
    needs: build
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Run unit tests with coverage
        run: >
          dotnet test ${{ env.TEST_PROJECT }}
          --no-restore
          --configuration Debug
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover
          --logger "trx;LogFileName=test-results.trx"

      - name: Convert coverage to Cobertura + OpenCover
        run: |
          ls -la coverage
          find coverage -name "coverage.cobertura.xml" -exec cp {} coverage.cobertura.xml \;
          find coverage -name "coverage.opencover.xml" -exec cp {} coverage.opencover.xml \;
          if [ ! -f coverage.cobertura.xml ]; then
            echo "::error::Cobertura report not generated"
            exit 1
          fi
          if [ ! -f coverage.opencover.xml ]; then
            echo "::error::OpenCover report not generated"
            exit 1
          fi

      - name: Generate HTML coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          ~/.dotnet/tools/reportgenerator \
            -reports:coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:Html \
            -assemblyfilters:-EmployeeManagementPortal.Web

      - name: Publish coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.opencover.xml
            coverage.cobertura.xml
            coverage-report/**
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: warn

      - name: Analyze Coverage with AI (NVIDIA NIM)
        id: analyze_coverage
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            
            // Parse coverage report
            const coberturaXml = fs.readFileSync('coverage.cobertura.xml', 'utf-8');
            const coverageMatch = coberturaXml.match(/line-rate="([0-9.]+)"/);
            const branchMatch = coberturaXml.match(/branch-rate="([0-9.]+)"/);
            const lineRate = coverageMatch ? parseFloat(coverageMatch[1]) : 0;
            const branchRate = branchMatch ? parseFloat(branchMatch[1]) : 0;
            const linePct = (lineRate * 100).toFixed(2);
            const branchPct = (branchRate * 100).toFixed(2);
            const threshold = parseFloat('${{ env.COVERAGE_THRESHOLD }}');
            const pass = parseFloat(linePct) >= threshold;
            
            // Parse test results
            const trxFiles = execSync('find . -name "*.trx"', { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
            let failedCount = 0, totalTests = 0, passedCount = 0;
            for (const f of trxFiles) {
              const trxContent = fs.readFileSync(f, 'utf-8');
              const trxMatch = trxContent.match(/total="(\d+)" passed="(\d+)" failed="(\d+)"/);
              if (trxMatch) {
                totalTests += parseInt(trxMatch[1]);
                passedCount += parseInt(trxMatch[2]);
                failedCount += parseInt(trxMatch[3]);
              }
            }
            
            const coverageData = {
              lineRate: linePct,
              branchRate: branchPct,
              threshold,
              pass,
              tests: { total: totalTests, passed: passedCount, failed: failedCount },
              generatedAt: new Date().toISOString()
            };
            
            // Call NVIDIA NIM API for analysis with timeout
            if (process.env.NVIDIA_API_KEY) {
              try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 120000); // 2 minute timeout
                
                const apiResponse = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${process.env.NVIDIA_API_KEY}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                  },
                  body: JSON.stringify({
                    model: 'meta/llama-3.3-70b-instruct',
                    temperature: 0.1,
                    top_p: 0.9,
                    max_tokens: 2048,
                    stream: false,
                    messages: [
                      { role: 'system', content: 'You are a CI coverage analyst. Produce a Markdown report with a coverage table (line %, branch %, threshold, pass/fail), a test summary, and concrete remediation suggestions where coverage is low.' },
                      { role: 'user', content: JSON.stringify(coverageData) }
                    ]
                  }),
                  signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!apiResponse.ok) {
                  const errorText = await apiResponse.text();
                  console.warn(`NVIDIA NIM API error ${apiResponse.status}: ${errorText.slice(0, 200)}`);
                } else {
                  const apiData = await apiResponse.json();
                  const modelReport = apiData.choices?.[0]?.message?.content?.trim() || '';
                  const coverageSummary = {
                    coverage: { lineRate: linePct, branchRate: branchPct, threshold, pass },
                    tests: { total: totalTests, passed: passedCount, failed: failedCount },
                    timestamp: coverageData.generatedAt,
                    model: 'meta/llama-3.3-70b-instruct',
                    report: modelReport
                  };
                  
                  fs.writeFileSync('coverage-summary.json', JSON.stringify(coverageSummary, null, 2));
                  fs.writeFileSync('coverage-report.md', modelReport);
                }
              } catch (error) {
                console.warn(`NVIDIA NIM API call failed: ${error.message}. Continuing without AI analysis.`);
              }
            }
            
            core.setOutput('coverage_pass', String(pass));
            core.setOutput('line_rate', linePct);
            core.setOutput('branch_rate', branchPct);

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            coverage-report.md
            coverage-summary.json
          if-no-files-found: warn

      - name: Fail build if coverage below threshold
        if: steps.analyze_coverage.outputs.coverage_pass != 'true'
        run: |
          echo "::error::Coverage below ${{ env.COVERAGE_THRESHOLD }}% threshold"
          exit 1

  # Trivy Scan Stage
  trivy:
    name: 3. Trivy Scan
    needs: test
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          TRIVY_VERSION="latest"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin $TRIVY_VERSION

      - name: Run Trivy filesystem scan
        run: |
          trivy fs --format json --output trivy-report.json --severity CRITICAL,HIGH,MEDIUM . || true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: error

      - name: Analyze Security Findings with AI (NVIDIA NIM)
        id: analyze_security
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportRaw = fs.existsSync('trivy-report.json') ? fs.readFileSync('trivy-report.json', 'utf-8') : null;
            
            if (!reportRaw) {
              core.setFailed('Trivy report not found');
              return;
            }
            
            const report = JSON.parse(reportRaw);
            const counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0 };
            const sample = [];
            
            for (const result of report.Results || []) {
              for (const vuln of result.Vulnerabilities || []) {
                const sev = (vuln.Severity || 'UNKNOWN').toUpperCase();
                if (counts[sev] !== undefined) counts[sev]++;
                if (sample.length < 5) sample.push({ target: result.Target, vulnID: vuln.VulnerabilityID, pkg: vuln.PkgName, severity: sev, title: vuln.Title });
              }
            }
            
            const securityData = {
              counts,
              sample,
              generatedAt: new Date().toISOString()
            };
            
            try {
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 120000); // 2 minute timeout
              
              const apiResponse = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.NVIDIA_API_KEY}`,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json'
                },
                body: JSON.stringify({
                  model: 'nvidia/llama-3.1-nemotron-ultra-253b-v1',
                  temperature: 0.1,
                  top_p: 0.9,
                  max_tokens: 1024,
                  stream: false,
                  messages: [
                    { role: 'system', content: 'You are a security analyst. Given a Trivy JSON report summary (counts and sample findings), write a concise Markdown summary.' },
                    { role: 'user', content: JSON.stringify(securityData) }
                  ]
                }),
                signal: controller.signal
              });
              
              clearTimeout(timeoutId);
              
              if (!apiResponse.ok) {
                const errorText = await apiResponse.text();
                console.warn(`NVIDIA NIM API error ${apiResponse.status}: ${errorText.slice(0, 200)}`);
              } else {
                const llmResponse = await apiResponse.json();
                const modelReport = llmResponse.choices?.[0]?.message?.content?.trim() || '';
                fs.writeFileSync('trivy-summary.md', modelReport);
                fs.writeFileSync('trivy-summary.json', JSON.stringify({ counts: securityData.counts, sample: securityData.sample, timestamp: securityData.generatedAt, model: 'nvidia/llama-3.1-nemotron-ultra-253b-v1' }, null, 2));
              }
            } catch (error) {
              console.warn(`NVIDIA NIM API call failed: ${error.message}. Continuing without AI analysis.`);
            }

      - name: Upload Trivy summary
        uses: actions/upload-artifact@v4
        with:
          name: trivy-summary
          path: |
            trivy-summary.md
            trivy-summary.json
          if-no-files-found: warn

  # CodeQL Scan Stage
  codeql:
    name: 4. CodeQL Scan
    needs: test
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Analyze CodeQL Results with AI (NVIDIA NIM)
        id: analyze_codeql
        uses: actions/github-script@v7
        if: always() && env.NVIDIA_API_KEY != ''
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');
            const sarifDir = execSync('find . -name "*.sarif"', { encoding: 'utf8' }).trim();
            
            let criticalCount = 0, mediumCount = 0, lowCount = 0;
            const sampleFindings = [];
            
            for (const f of sarifDir.split('\n').filter(Boolean)) {
              const sarif = JSON.parse(fs.readFileSync(f, 'utf-8'));
              for (const run of sarif.runs || []) {
                for (const result of run.results || []) {
                  const level = result.level || 'warning';
                  if (level === 'error') criticalCount++;
                  else if (level === 'warning') mediumCount++;
                  else lowCount++;
                  if (sampleFindings.length < 3) {
                    sampleFindings.push({
                      ruleId: result.ruleId,
                      level,
                      message: (result.message && result.message.text) ? result.message.text.slice(0, 240) : ''
                    });
                  }
                }
              }
            }
            
            const codeqlData = {
              critical: criticalCount,
              medium: mediumCount,
              low: lowCount,
              riskScore: criticalCount * 10 + mediumCount * 3 + lowCount,
              sampleFindings,
              generatedAt: new Date().toISOString()
            };
            
            try {
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 120000); // 2 minute timeout
              
              const apiResponse = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${process.env.NVIDIA_API_KEY}`,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json'
                },
                body: JSON.stringify({
                  model: 'nvidia/llama-3.3-nemotron-super-49b-v1.5',
                  temperature: 0.1,
                  top_p: 0.9,
                  max_tokens: 2048,
                  stream: false,
                  messages: [
                    { role: 'system', content: 'You are a security analyst. Given a CodeQL severity tally and findings, write a Markdown report.' },
                    { role: 'user', content: JSON.stringify(codeqlData) }
                  ]
                }),
                signal: controller.signal
              });
              
              clearTimeout(timeoutId);
              
              if (!apiResponse.ok) {
                const errorText = await apiResponse.text();
                console.warn(`CodeQL API error ${apiResponse.status}: ${errorText.slice(0, 200)}`);
              } else {
                const llmResponse = await apiResponse.json();
                const modelReport = llmResponse.choices?.[0]?.message?.content?.trim() || '';
                const summary = {
                  critical: criticalCount,
                  medium: mediumCount,
                  low: lowCount,
                  riskScore: codeqlData.riskScore,
                  timestamp: codeqlData.generatedAt,
                  model: 'nvidia/llama-3.3-nemotron-super-49b-v1.5',
                  sampleFindings,
                  report: modelReport
                };
                
                fs.writeFileSync('security-analysis.md', modelReport);
                fs.writeFileSync('security-analysis.json', JSON.stringify(summary, null, 2));
              }
            } catch (error) {
              console.warn(`CodeQL API call failed: ${error.message}. Continuing without AI analysis.`);
            }

      - name: Upload security analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-analysis
          path: |
            security-analysis.md
            security-analysis.json
          if-no-files-found: warn

