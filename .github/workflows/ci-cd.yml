name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: EmployeeManagementPortal.sln
  TEST_PROJECT: tests/EmployeeManagementPortal.Tests/EmployeeManagementPortal.Tests.csproj
  COVERAGE_THRESHOLD: 85
  # NVIDIA_API_KEY must be a build.nvidia.com "nvapi-..." key with the
  # "Public API Endpoints" permission. The four LLM "agent" steps below
  # call https://integrate.api.nvidia.com/v1/chat/completions and skip
  # themselves when this secret is missing.

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write
  actions: read

jobs:
  # ----------------------------------------------------------------------
  # Stage 1: Build
  # ----------------------------------------------------------------------
  build:
    name: 1. Build
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.publish.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution (Debug)
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Debug

      - name: Build summary
        id: publish
        run: |
          echo "version=$(date +%Y.%m.%d)-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "## Build Summary" > build-summary.md
          echo "- **Status**: ✅ Success" >> build-summary.md
          echo "- **Branch**: ${{ github.ref_name }}" >> build-summary.md
          echo "- **Commit**: ${{ github.sha }}" >> build-summary.md
          echo "- **Version**: ${{ steps.publish.outputs.version }}" >> build-summary.md
          echo "- **Triggered by**: ${{ github.actor }}" >> build-summary.md
      - name: Publish build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-summary
          path: build-summary.md
          if-no-files-found: warn

  # ----------------------------------------------------------------------
  # Stage 2: Test + Coverage Analysis
  # ----------------------------------------------------------------------
  test:
    name: 2. Test + Coverage
    needs: build
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Run unit tests with coverage
        run: >
          dotnet test ${{ env.TEST_PROJECT }}
          --no-restore
          --configuration Debug
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover
          --logger "trx;LogFileName=test-results.trx"
      - name: Convert coverage to Cobertura + OpenCover
        run: |
          ls -la coverage
          find coverage -name "coverage.cobertura.xml" -exec cp {} coverage.cobertura.xml \;
          find coverage -name "coverage.opencover.xml" -exec cp {} coverage.opencover.xml \;
          if [ ! -f coverage.cobertura.xml ]; then
            echo "::error::Cobertura report not generated"
            exit 1
          fi
          if [ ! -f coverage.opencover.xml ]; then
            echo "::error::OpenCover report not generated"
            exit 1
          fi
      - name: Generate HTML coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          ~/.dotnet/tools/reportgenerator \
            -reports:coverage.cobertura.xml \
            -targetdir:coverage-report \
            -reporttypes:Html \
            -assemblyfilters:-EmployeeManagementPortal.Web
      - name: Publish coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.opencover.xml
            coverage.cobertura.xml
            coverage-report/**
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: warn

      - name: Coverage Analysis Agent (NVIDIA NIM)
        id: coverage-analysis
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Step 1: deterministic data extraction (unchanged from previous impl).
            const cobertura = fs.readFileSync('coverage.cobertura.xml', 'utf-8');
            const coverageMatch = cobertura.match(/line-rate="([0-9.]+)"/);
            const branchMatch = cobertura.match(/branch-rate="([0-9.]+)"/);
            const lineRate = coverageMatch ? parseFloat(coverageMatch[1]) : 0;
            const branchRate = branchMatch ? parseFloat(branchMatch[1]) : 0;
            const linePct = (lineRate * 100).toFixed(2);
            const branchPct = (branchRate * 100).toFixed(2);
            const threshold = parseFloat('${{ env.COVERAGE_THRESHOLD }}');
            const pass = parseFloat(linePct) >= threshold;
            const trxFiles = require('child_process').execSync('find . -name "*.trx"', { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
            let failed = 0, total = 0, passed = 0;
            for (const f of trxFiles) {
              const c = fs.readFileSync(f, 'utf-8');
              const m = c.match(/total="(\d+)" passed="(\d+)" failed="(\d+)"/);
              if (m) {
                total += parseInt(m[1]);
                passed += parseInt(m[2]);
                failed += parseInt(m[3]);
              }
            }
            const facts = {
              lineRate: linePct, branchRate: branchPct, threshold,
              pass, tests: { total, passed, failed },
              generatedAt: new Date().toISOString()
            };
            // Step 2: ask the model to write the human-facing Markdown.
            const res = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.NVIDIA_API_KEY}`,
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                model: 'meta/llama-3.3-70b-instruct',
                temperature: 0.1,
                top_p: 0.9,
                max_tokens: 2048,
                stream: false,
                messages: [
                  { role: 'system', content: 'You are a CI coverage analyst. Produce a Markdown report with a coverage table (line %, branch %, threshold, pass/fail), a test summary, and concrete recommendations for bringing line coverage above the threshold. Do not invent numbers — only use the inputs provided.' },
                  { role: 'user', content: JSON.stringify(facts) }
                ]
              })
            });
            if (!res.ok) {
              const errText = await res.text();
              core.setFailed(`NVIDIA NIM ${res.status}: ${errText.slice(0, 500)}`);
              return;
            }
            const data = await res.json();
            const modelText = data.choices?.[0]?.message?.content?.trim() || '';
            // Keep JSON shape compatible with downstream Stage 5 reader
            // (coverage.coverage.pass and coverage.tests.*) plus new fields.
            const summary = {
              coverage: { lineRate: linePct, branchRate: branchPct, threshold, pass },
              tests: { total, passed, failed },
              timestamp: facts.generatedAt,
              model: 'meta/llama-3.3-70b-instruct',
              report: modelText
            };
            fs.writeFileSync('coverage-summary.json', JSON.stringify(summary, null, 2));
            fs.writeFileSync('coverage-report.md', modelText);
            // Gate outputs are still derived from the deterministic facts,
            // not the model output, so the failure gate below stays honest.
            core.setOutput('coverage_pass', String(pass));
            core.setOutput('line_rate', linePct);
            core.setOutput('branch_rate', branchPct);
      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: |
            coverage-report.md
            coverage-summary.json
          if-no-files-found: error

      - name: Fail build if coverage below threshold
        if: steps.coverage-analysis.outputs.coverage_pass != 'true'
        run: |
          echo "::error::Coverage below ${{ env.COVERAGE_THRESHOLD }}% threshold"
          exit 1
  # ----------------------------------------------------------------------
  # Stage 3: SonarCloud Security Scan
  # ----------------------------------------------------------------------
  sonar:
    name: 3. SonarCloud Scan
    needs: test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create SonarCloud cache directory
        run: mkdir -p ~/.sonar/cache
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Run SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          dotnet tool install -g dotnet-sonarscanner
          export PATH="$PATH:$HOME/.dotnet/tools"
          # PR-specific properties are only valid when the run was triggered by a
          # pull_request event. On push, github.event.pull_request.* and
          # github.head_ref are empty, which SonarScanner rejects as an invalid
          # property value.
          PR_ARGS=""
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR_ARGS="/d:sonar.pullrequest.provider=github \
              /d:sonar.pullrequest.github.repository=${{ github.repository }} \
              /d:sonar.pullrequest.key=${{ github.event.pull_request.number }} \
              /d:sonar.pullrequest.branch=${{ github.head_ref }}"
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          dotnet-sonarscanner begin \
            /k:"feature-dotnet" \
            /o:"nikita-jo" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONARCLOUD_TOKEN }}" \
            /d:sonar.cs.opencover.reportsPaths="coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Tests/**,**/wwwroot/**,**/*.cshtml" \
            /d:sonar.branch.name="$BRANCH_NAME" \
            $PR_ARGS
          dotnet build ${{ env.SOLUTION }} --no-incremental
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONARCLOUD_TOKEN }}"
      - name: Sonar Security Agent (NVIDIA NIM)
        if: ${{ env.SONAR_TOKEN != '' && env.NVIDIA_API_KEY != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            // Step 1: pull the quality-gate payload from SonarCloud.
            const auth = 'Basic ' + Buffer.from(process.env.SONAR_TOKEN + ':').toString('base64');
            const url = 'https://sonarcloud.io';
            const projectKey = 'feature-dotnet';
            const response = await fetch(`${url}/api/qualitygates/project_status?projectKey=${projectKey}`, {
              headers: { Authorization: auth }
            });
            if (!response.ok) {
              const t = await response.text();
              core.setFailed(`SonarCloud ${response.status}: ${t.slice(0, 500)}`);
              return;
            }
            const data = await response.json();
            const status = data.projectStatus;
            const facts = {
              qualityGate: status.status,
              conditions: status.conditions.map(c => ({
                metric: c.metricKey,
                status: c.status,
                value: c.actualValue
              })),
              counts: {
                bugs: (status.conditions.find(c => c.metricKey === 'bugs') || {}).actualValue || 0,
                vulnerabilities: (status.conditions.find(c => c.metricKey === 'new_vulnerabilities') || {}).actualValue || 0,
                codeSmells: (status.conditions.find(c => c.metricKey === 'code_smells') || {}).actualValue || 0
              },
              generatedAt: new Date().toISOString()
            };
            // Step 2: ask the model for a prose summary.
            const res = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.NVIDIA_API_KEY}`,
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                model: 'nvidia/llama-3.1-nemotron-ultra-253b-v1',
                temperature: 0.1,
                top_p: 0.9,
                max_tokens: 2048,
                stream: false,
                messages: [
                  { role: 'system', content: 'You are a security analyst. Given a SonarCloud quality-gate payload, write a Markdown summary naming the failing metrics, what they mean in plain English, and a prioritized remediation list. Do not invent numbers.' },
                  { role: 'user', content: JSON.stringify(facts) }
                ]
              })
            });
            if (!res.ok) {
              const errText = await res.text();
              core.setFailed(`NVIDIA NIM ${res.status}: ${errText.slice(0, 500)}`);
              return;
            }
            const llm = await res.json();
            const modelText = llm.choices?.[0]?.message?.content?.trim() || '';
            // Preserve JSON shape for downstream Stage 5 reader
            // (qualityGate, conditions, timestamp).
            const summary = {
              qualityGate: facts.qualityGate,
              conditions: facts.conditions,
              timestamp: facts.generatedAt,
              model: 'nvidia/llama-3.1-nemotron-ultra-253b-v1',
              counts: facts.counts,
              report: modelText
            };
            require('fs').writeFileSync('security-summary.md', modelText);
            require('fs').writeFileSync('security-summary.json', JSON.stringify(summary, null, 2));
      - name: Upload security summary
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: |
            security-summary.md
            security-summary.json
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # Stage 4: CodeQL Security Scan
  # ----------------------------------------------------------------------
  codeql:
    name: 4. CodeQL Scan
    needs: test
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Debug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Security Analysis Agent (NVIDIA NIM)
        uses: actions/github-script@v7
        if: always() && env.NVIDIA_API_KEY != ''
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            // Step 1: deterministic severity tally (unchanged).
            const sarifDir = require('child_process').execSync('find . -name "*.sarif"', { encoding: 'utf8' }).trim();
            let critical = 0, medium = 0, low = 0;
            const sampleFindings = [];
            for (const f of sarifDir.split('\n').filter(Boolean)) {
              const sarif = JSON.parse(fs.readFileSync(f, 'utf-8'));
              for (const run of sarif.runs || []) {
                for (const result of run.results || []) {
                  const level = result.level || 'warning';
                  if (level === 'error') critical++;
                  else if (level === 'warning') medium++;
                  else low++;
                  if (sampleFindings.length < 3) {
                    sampleFindings.push({
                      ruleId: result.ruleId,
                      level,
                      message: (result.message && result.message.text) ? result.message.text.slice(0, 240) : ''
                    });
                  }
                }
              }
            }
            const facts = {
              critical, medium, low,
              riskScore: critical * 10 + medium * 3 + low,
              sampleFindings,
              generatedAt: new Date().toISOString()
            };
            // Step 2: ask the model to write a prose OWASP report.
            const res = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.NVIDIA_API_KEY}`,
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                model: 'nvidia/llama-3.3-nemotron-super-49b-v1.5',
                temperature: 0.1,
                top_p: 0.9,
                max_tokens: 2048,
                stream: false,
                messages: [
                  { role: 'system', content: 'You are a security analyst. Given a CodeQL severity tally and short sample findings, write a Markdown report with severity table, a 1-2 sentence description of what each severity level means, OWASP Top 10 mapping, and concrete next-step suggestions. Do not invent CVEs.' },
                  { role: 'user', content: JSON.stringify(facts) }
                ]
              })
            });
            if (!res.ok) {
              const errText = await res.text();
              core.setFailed(`NVIDIA NIM ${res.status}: ${errText.slice(0, 500)}`);
              return;
            }
            const llm = await res.json();
            const modelText = llm.choices?.[0]?.message?.content?.trim() || '';
            // Preserve JSON shape for downstream Stage 5 reader
            // (critical, medium, low, riskScore, timestamp).
            const summary = {
              critical, medium, low,
              riskScore: facts.riskScore,
              timestamp: facts.generatedAt,
              model: 'nvidia/llama-3.3-nemotron-super-49b-v1.5',
              sampleFindings,
              report: modelText
            };
            fs.writeFileSync('security-analysis.md', modelText);
            fs.writeFileSync('security-analysis.json', JSON.stringify(summary, null, 2));
      - name: Upload security analysis
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-analysis
          path: |
            security-analysis.md
            security-analysis.json
          if-no-files-found: warn

  # ----------------------------------------------------------------------
  # Stage 5: AI Code Review
  # ----------------------------------------------------------------------
  code-review:
    name: 5. AI Code Review
    needs: [test, sonar, codeql]
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Capture PR diff
        if: env.NVIDIA_API_KEY != ''
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            git diff --unified=3 "origin/${{ github.base_ref }}"...HEAD > pr.diff || true
          else
            # On push, diff the previous successful commit on the same branch.
            git diff --unified=3 HEAD~1...HEAD > pr.diff || true
          fi
          # Cap the diff at ~80k chars to keep the prompt within model limits.
          head -c 80000 pr.diff > pr.diff.tmp && mv pr.diff.tmp pr.diff
          echo "diff_size=$(wc -c < pr.diff) bytes"

      - name: Enterprise Code Review Agent (NVIDIA NIM)
        if: env.NVIDIA_API_KEY != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const artifactsDir = 'artifacts';
            const read = (name) => {
              try { return fs.readFileSync(path.join(artifactsDir, name), 'utf-8'); }
              catch { return null; }
            };
            const readRoot = (name) => {
              try { return fs.readFileSync(name, 'utf-8'); }
              catch { return null; }
            };
            const coverage = read('coverage-report/coverage-summary.json');
            const sonar = read('security-summary/security-summary.json');
            const codeql = read('security-analysis/security-analysis.json');
            const coverageData = coverage ? JSON.parse(coverage) : null;
            const sonarData = sonar ? JSON.parse(sonar) : null;
            const codeqlData = codeql ? JSON.parse(codeql) : null;
            // pr.diff is written to the workspace root by the Capture PR diff step.
            const diff = readRoot('pr.diff') || '';
            // Deterministic baseline score from the three summary JSONs.
            const baselineScore = (
              (coverageData?.coverage?.pass ? 9 : 6) +
              (sonarData?.qualityGate === 'OK' ? 9 : 5) +
              ((codeqlData?.critical || 0) === 0 ? 9 : 5)
            ) / 3;
            const facts = {
              generatedAt: new Date().toISOString(),
              baselineScore: Number(baselineScore.toFixed(2)),
              coverage: coverageData,
              sonar: sonarData,
              codeql: codeqlData,
              prDiff: diff.slice(0, 60000)
            };
            const res = await fetch('https://integrate.api.nvidia.com/v1/chat/completions', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.NVIDIA_API_KEY}`,
                'Content-Type': 'application/json',
                'Accept': 'application/json'
              },
              body: JSON.stringify({
                model: 'qwen/qwen3-coder-480b-a35b-instruct',
                temperature: 0.2,
                top_p: 0.9,
                max_tokens: 4096,
                stream: false,
                messages: [
                  { role: 'system', content: 'You are a senior staff engineer producing an enterprise code review. Given the CI coverage, SonarCloud quality-gate, CodeQL security summary, and the PR diff, produce a JSON object with fields: overallScore (0-10, one decimal), rating (X/10 string), architecture {score, notes}, performance {score, notes}, security {score, notes}, maintainability {score, notes}, technicalDebt {score, notes}, bestPractices {score, notes}, recommendations (array of strings). Output ONLY the JSON object, no prose, no fences.' },
                  { role: 'user', content: JSON.stringify(facts) }
                ]
              })
            });
            if (!res.ok) {
              const errText = await res.text();
              core.setFailed(`NVIDIA NIM ${res.status}: ${errText.slice(0, 500)}`);
              return;
            }
            const llm = await res.json();
            const raw = llm.choices?.[0]?.message?.content?.trim() || '';
            // The model is instructed to return JSON only; strip stray fences if any.
            const cleaned = raw.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
            let review;
            try {
              review = JSON.parse(cleaned);
            } catch (e) {
              fs.writeFileSync('code-review-report.md',
                '# Enterprise Code Review\n\n' +
                `**Generated**: ${facts.generatedAt}\n\n` +
                '## Model Output (unparseable)\n\n```\n' + raw + '\n```\n\n' +
                `**Error**: ${e.message}\n`
              );
              core.setFailed(`Model output was not valid JSON: ${e.message}`);
              return;
            }
            // Shape-stable wrapper so consumers downstream see a consistent object.
            const wrapped = {
              generatedAt: facts.generatedAt,
              model: 'qwen/qwen3-coder-480b-a35b-instruct',
              baselineScore: facts.baselineScore,
              overallScore: review.overallScore ?? facts.baselineScore,
              rating: review.rating ?? `${review.overallScore ?? facts.baselineScore}/10`,
              architecture: review.architecture,
              performance: review.performance,
              security: review.security,
              maintainability: review.maintainability,
              technicalDebt: review.technicalDebt,
              bestPractices: review.bestPractices,
              recommendations: review.recommendations || []
            };
            const md = [
              '# Enterprise Code Review',
              '',
              `**Generated**: ${wrapped.generatedAt}`,
              '',
              `## Overall Score: ${wrapped.overallScore} / 10 (baseline ${wrapped.baselineScore} / 10)`,
              '',
              '## Architecture',
              `Score: ${wrapped.architecture?.score}/10 — ${wrapped.architecture?.notes || ''}`,
              '',
              '## Performance',
              `Score: ${wrapped.performance?.score}/10 — ${wrapped.performance?.notes || ''}`,
              '',
              '## Security',
              `Score: ${wrapped.security?.score}/10 — ${wrapped.security?.notes || ''}`,
              '',
              '## Maintainability',
              `Score: ${wrapped.maintainability?.score}/10 — ${wrapped.maintainability?.notes || ''}`,
              '',
              '## Technical Debt',
              `Score: ${wrapped.technicalDebt?.score}/10 — ${wrapped.technicalDebt?.notes || ''}`,
              '',
              '## Best Practices',
              `Score: ${wrapped.bestPractices?.score}/10 — ${wrapped.bestPractices?.notes || ''}`,
              '',
              '## Improvement Suggestions',
              ...(wrapped.recommendations.length
                ? wrapped.recommendations.map(r => `- ${r}`)
                : ['- (no recommendations returned)'])
            ].join('\n');
            fs.writeFileSync('code-review-report.md', md);
            fs.writeFileSync('code-review-report.json', JSON.stringify(wrapped, null, 2));
      - name: Upload code review
        uses: actions/upload-artifact@v4
        with:
          name: code-review
          path: |
            code-review-report.md
            code-review-report.json
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # Stage 6: Deploy
  # ----------------------------------------------------------------------
  deploy:
    name: 6. Deploy
    needs: [build, test, sonar, codeql, code-review]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Publish application
        run: |
          dotnet publish src/EmployeeManagementPortal.Web/EmployeeManagementPortal.Web.csproj \
            -c Release \
            -o ./publish \
            --no-restore
      - name: Create deployment package
        run: |
          cd publish
          zip -r ../app.zip . -x "*.pdb"
          cd ..
          ls -la app.zip
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: employee-management-portal
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./app.zip

      - name: Generate deployment summary
        run: |
          cat > deployment-summary.md <<EOF
          # Deployment Summary
          **Status**: ✅ Deployed
          **Environment**: Production
          **Branch**: ${{ github.ref_name }}
          **Commit**: ${{ github.sha }}
          **Deployed by**: ${{ github.actor }}
          **Timestamp**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ## Deployment URL
          https://employee-management-portal.azurewebsites.net
          ## Artifacts
          - Application: ./app.zip
          - Size: $(du -h app.zip | cut -f1)
          EOF
          cat > deployment-logs.txt <<EOF
          Publishing project...
          dotnet publish -c Release
          Restoring NuGet packages...
          Compiling...
          Optimizing assemblies...
          Creating deployment package...
          Deploying to Azure...
          App Service: employee-management-portal
          Deployment status: 4 (Success)
          EOF
      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-summary
          path: |
            deployment-summary.md
            deployment-logs.txt
            app.zip
          if-no-files-found: error